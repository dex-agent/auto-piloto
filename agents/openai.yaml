interface:
  display_name: "Auto Piloto (DriveAutoTeste)"
  short_description: "Automação de UI Win32 por handles (CLI DriveAutoTeste 1.9.0 incluso)"
  default_prompt: |
    Use $auto-piloto. Use o CLI DriveAutoTeste (bin/DriveAutoTeste.exe, dentro da pasta desta skill) para automatizar o teste da UI Win32 do projeto: 1) `--json schema` para ver os 16 comandos e as flags; 2) `find --hwnd 0` para listar janelas abertas e `find (--hwnd N | --pid N) --caption-contains S --vis all|visible|invisible` para localizar janelas/controles (saída com parentclass = classe do pai; popups de menu com `find --pid N --popups`); 3) agir: key/mouse/paste/shot, `wait --until enabled|text|gone` para esperar o estado do controle antes de agir e `probe --hwnd N --text-contains S` como sensor de condição (stdout de uma palavra: pronto ou esperando); 4) escreva um workflow .wh (steps run/wait/click/text/key/mouse/shot/assert-text/assert-file/assert-empty/close) e rode com `play --file ... --var exe=<path>` (posicionais na ordem do bloco params). Prefira `--json` quando consumir a saída por script (o `--json` é ASCII puro desde a 1.8.0: acento sai como \uXXXX e decodifica em UTF-8) e filtre a saída com regex/grep em vez de despejar o JSON inteiro. Conteúdo DOM de browser/Electron fica com CDP (CDP pra página, handles pra janela). Nunca declare impossível automatizar UI Win32 antes de enumerar handles e enviar a mensagem.
